services:
  api:
    build: ./api
    environment:
      SIBYL_DB_PATH: /data/memory.db
      SIBYL_TENANT_ID: mercury
      WEB_ORIGIN: http://localhost:3000
      BASE_SEPOLIA_RPC_URL: ${BASE_SEPOLIA_RPC_URL:-https://sepolia.base.org}
      BASE_RECEIPTS_CONTRACT: ${BASE_RECEIPTS_CONTRACT:-}
    volumes:
      - mercury-sibyl:/data
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 10s
      timeout: 3s
      retries: 5

  web:
    build:
      context: .
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
        NEXT_PUBLIC_BASE_SEPOLIA_RPC_URL: ${BASE_SEPOLIA_RPC_URL:-https://sepolia.base.org}
        NEXT_PUBLIC_BASE_RECEIPTS_CONTRACT: ${BASE_RECEIPTS_CONTRACT:-}
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "3000:3000"

  contracts:
    profiles: ["contracts"]
    build: ./contracts

volumes:
  mercury-sibyl:

